[package]
name = "rs-cat4sqlite"
version = "0.1.0"
edition = "2024"

description = "Concatenates the string/blob value of the rows in the db."
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-cat4sqlite"
homepage = "https://github.com/takanoriyanagitani/rs-cat4sqlite"
documentation = "https://docs.rs/rs-cat4sqlite/latest"
keywords = ["sqlite", "cat", "wasi", "blob", "string"]

exclude = [
  "example.sqlite.db3",
  "cat4sqlite.wasm",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "cat4sqlite"

[dependencies.rusqlite]
version = "0.40.2"
default-features = false
features = [
    "bundled",
    "wasm32-wasi-vfs",
]
